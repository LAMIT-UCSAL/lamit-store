updated: '2026-10-14T15:00:00-03:00'

top_issues:
  - id: 'REL-001'
    severity: medium
    status: open
    finding: 'data/products.json:191: o formsUrl da caneca pré-preenche entry.1726040702=Ecobag+Lamit, então os pedidos da caneca chegam ao Forms identificados como ecobag. Pendência conhecida (o time ainda está decidindo).'
    suggested_action: 'Antes de divulgar a caneca: criar no Forms a opção "Caneca" e trocar o parâmetro para Caneca+Na+Minha+M%C3%A1quina+Funciona. Responsáveis: @po (decisão) e @dev (troca do link).'
  - id: 'A11Y-002'
    severity: low
    status: open
    finding: 'js/product-detail.js:269: a barra fixa de CTA (.product-detail__sticky-bar) é inserida direto no body, fora de qualquer landmark (axe best-practice "region", moderate, PDP em 375px). Comportamento anterior às correções, só detectado agora porque o axe rodou no mobile.'
    suggested_action: 'Anexar a barra dentro do <main id="product-detail"> ou envolvê-la em <aside aria-label="Pedido rápido">.'
  - id: 'REQ-001'
    severity: medium
    status: resolved
    finding: 'Copy do passo 03 contradizia o products.json (30 un. / 2 semanas para todos).'
    resolution: 'index.html:122 agora diz: mínimo de 30 camisetas, ou 5 ecobags ou canecas, ou em até 1 mês; cerca de 2 semanas para camisetas e 1 semana para ecobag e caneca. Bate com os deliveryNote do data/products.json (linhas 32, 66, 116, 153 e 190). PRODUCT.md:33 alinhado.'
  - id: 'A11Y-001'
    severity: medium
    status: resolved
    finding: 'O Tab escapava do menu mobile aberto.'
    resolution: 'js/site.js:11-43 + css/components.css:160-165. Verificado em 375px (home e PDP) e em 320px. Ao abrir, ficam inert skip-link, breadcrumb, main, footer, barra fixa e marca; o foco vai para "Drop 01"; o Tab circula só entre os links, o botão "Fechar menu" e a barra do navegador (Shift+Tab idem). Esc fecha, devolve o foco ao botão e remove todos os inert. Toque abre e fecha. O link "Como funciona" navega para /#como-funciona, fecha o menu e restaura o overflow. Ao redimensionar para 1024px com o menu aberto, ele fecha e não sobra inert. A nav desktop continua navegando (#sobre). axe com o menu aberto: 0 violações.'
  - id: 'UX-001'
    severity: low
    status: resolved
    finding: 'O hero__meta quebrava no meio de um item em 320px.'
    resolution: 'index.html:61 + css/components.css:365. Em 320px, a linha ainda ocupa 2 linhas, mas a quebra cai entre itens ("3 CAMISETAS · 1 ECOBAG · / 1 CANECA"), sem overflow (scrollWidth 320). Atende à correção sugerida.'
  - id: 'PERF-001'
    severity: low
    status: resolved
    finding: 'O logo do rodapé tinha 138KB e a imagem LCP da PDP não tinha preload.'
    resolution: 'O logo baixou para 47.818 bytes, renderiza a 135x64 (natural 742x351). A diferença de pixels contra o screenshot anterior à correção dá erro médio de 0,68/255 e 1,27% de pixels acima de 16 (só antialias), visualmente idêntico. Preload em produtos/*.html:21: nas 5 PDPs, em 1280 e 375px, o href do preload é igual ao currentSrc da imagem principal, há 1 única requisição da imagem, ela é o elemento LCP e não aparece nenhum aviso "preloaded but not used" no console após 4,5s. LCP local de cerca de 0,8 a 1,2s (medido com --no-proxy-server; sem essa flag o Chrome headless desta máquina leva cerca de 20s de TTFB por detecção de proxy, um artefato do ambiente e não da aplicação).'

