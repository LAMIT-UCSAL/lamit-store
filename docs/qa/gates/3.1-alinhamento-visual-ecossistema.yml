nfr_validation:
  security:
    status: PASS
    notes: 'innerHTML só com SVG estático (product-detail.js:103,110) e limpeza do grid (main.js:175); dados do JSON inseridos via textContent. Os 15 links target=_blank têm rel="noopener noreferrer". Risco externo: netlify.toml publish="." (ver risks).'
  performance:
    status: PASS
    notes: 'Home com cerca de 1,1MB transferido sem o axe (hero 112KB em WebP, imagens de comunidade lazy). Fonte com display=swap. Todos os scripts com defer; Grainient iniciado em requestIdleCallback, com DPR limitado a 1.5. PERF-001 resolvido no re-review (logo com 47KB, preload da imagem da PDP).'
  reliability:
    status: PASS
    notes: 'Fallback de erro no fetch, "Produto não encontrado", fallback sem WebGL2, try/catch no setup do shader.'
  maintainability:
    status: CONCERNS
    notes: 'Header e rodapé duplicados em 6 HTMLs (marcados com "SHARED"); toWebp() duplicada em main.js e product-detail.js. Aceitável sem build, mas é débito (migração para Vite já prevista).'
  accessibility:
    status: PASS
    notes: 'axe sem violações; foco visível com outline laranja de 2px em tabs, cards, CTA e links; abas com aria-pressed; chips com aria-pressed; skip-link presente; alt text descritivo. A11Y-001 resolvido no re-review (inert + foco gerenciado). Fica só A11Y-002 (low).'

risks:
  - id: 'RISK-SEC-001'
    severity: high
    owner: '@devops'
    blocks_gate: false
    finding: 'netlify.toml usa publish = "." e command = "", então o deploy publica o repositório inteiro (.aiox-core/, .claude/, docs/, PRODUCT.md, a pasta lamit-store/ e scripts).'
    justification_non_blocking: 'Configuração anterior à story e fora do escopo dela (já listada em "Fora de escopo").'
    suggested_action: 'Publicar só os artefatos do site (pasta dist/ gerada por cópia, ou publish em um subdiretório public/) e/ou adicionar regras de bloqueio em _redirects. Fazer antes do próximo deploy.'
  - id: 'RISK-REPO-001'
    severity: medium
    owner: '@devops'
    blocks_gate: false
    finding: 'A pasta lamit-store/ (aninhada, não versionada) está na raiz e seria publicada pelo publish=".".'
    suggested_action: 'Remover a pasta ou adicioná-la ao .gitignore e confirmar a origem com o usuário.'
  - id: 'RISK-BIZ-001'
    severity: medium
    owner: '@po'
    blocks_gate: false
    finding: 'Formulário da caneca provisório (REL-001) e URL de produção do site LAMIT desconhecida ("LAMIT ↗" aponta para o Linktree).'

