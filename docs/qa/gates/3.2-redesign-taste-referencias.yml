top_issues:
  - id: 'A11Y-001'
    severity: medium
    status: open
    finding: 'css/components.css:730 (.manifesto__text, 20px/600) e :723 (.manifesto__title) em branco sobre o Grainient (#C17402 / #0A3383, js/grainient.js:35-37). Amostragem de pixels atrás do texto com o canvas ativo, em 4 momentos, a 1440 e 390px. Parágrafo: mínimo de 2,62:1 e p5 entre 2,8 e 3,1:1 (precisa de 4,5:1, porque 600/20px não conta como texto grande). Título de 56px: p5 entre 3,1 e 3,5:1, com pixels a 2,6:1. O text-shadow que a 3.1 tinha no título da faixa foi removido.'
    suggested_action: 'Adicionar text-shadow escuro (ex.: 0 1px 24px rgba(8,21,54,.45)) ou uma película radial em night atrás do bloco de texto, ou subir o parágrafo para 700 e 24px. Medir de novo: p5 >= 4,5 no parágrafo e >= 3 no título.'
  - id: 'REQ-001'
    severity: low
    status: open
    finding: 'index.html:172: "O formulário do pedido traz as instruções." não tem fonte em PRODUCT.md nem no conteúdo anterior (Article IV).'
    suggested_action: 'Remover a frase ou confirmar com o time.'
  - id: 'REQ-002'
    severity: low
    status: open
    finding: 'index.html:63: "feitas sob encomenda em Salvador" afirma o local de produção. A fonte só sustenta "Feito sob encomenda" e "Salvador · BA", e o local do fornecedor não está documentado (Article IV).'
    suggested_action: 'Reescrever, ex.: "...oficiais da LAMIT, de Salvador, feitas sob encomenda. A partir de R$ 35."'
  - id: 'UX-001'
    severity: low
    status: open
    finding: 'css/components.css:268: .btn--on-dark passou a ser branco com texto cobalto. O único uso restante é a barra fixa da PDP (js/product-detail.js:282), que muda de visual no mobile. Contraste OK (11:1), mas a mudança está fora do escopo e não aparece na File List.'
    suggested_action: 'Confirmar com o usuário e registrar na File List, ou restaurar o estilo anterior só para a barra fixa.'
  - id: 'MNT-001'
    severity: low
    status: open
    finding: 'css/components.css:186-188: .kicker--on-dark ficou sem uso (.kicker continua em uso na PDP). Os tokens --font-size-xs e --font-size-small agora são iguais (css/tokens.css:45-46).'
    suggested_action: 'Remover .kicker--on-dark; unificar os tokens numa próxima limpeza.'
